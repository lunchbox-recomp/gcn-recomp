name: CI
on:
  pull_request:
  push:
    branches-ignore: ['topic/**', 'pr/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No game names in the tree
        run: python3 tools/check_generic.py
      - name: Dependencies
        run: brew install ninja
      - name: Configure without a game
        run: cmake -S . -B build -G Ninja
      - name: Unit tests
        run: ninja -C build unit
